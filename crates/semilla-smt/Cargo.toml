[package]
name = "semilla-smt"
description = "SMT checks for semilla: condition effects, expression equivalence, and rewrite rule tests."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
semilla-core = { path = "../semilla-core" }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
