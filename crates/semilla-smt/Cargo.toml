[package]
name = "semilla-smt"
description = "SMT checks for semilla: condition effects, expression equivalence, and rewrite rule tests."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
semilla-core = { path = "../semilla-core" }
semilla-intent = { path = "../semilla-intent" }
semilla-syntax = { path = "../semilla-syntax" }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
