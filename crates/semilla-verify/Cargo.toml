[package]
name = "semilla-verify"
description = "The semilla verifier: checks the claims of each step and the coverage of the change set."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
toml = "0.8"
anyhow = "1"
semilla-core = { path = "../semilla-core" }
semilla-intent = { path = "../semilla-intent" }
semilla-syntax = { path = "../semilla-syntax" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
