[package]
name = "semilla-core"
description = "The semilla data model: anchors, claims, steps, groups, reports, and view types."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# The JSON texts keep the order of their keys (the records, the hints, the stored reports).
serde_json = { version = "1", features = ["preserve_order"] }
