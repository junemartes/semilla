[package]
name = "semilla-mir"
description = "A rustc driver that prints the normalized MIR of each local body."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "semilla-mir-driver"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.rust-analyzer]
rustc_private = true
