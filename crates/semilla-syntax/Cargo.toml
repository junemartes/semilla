[package]
name = "semilla-syntax"
description = "The syntax view of semilla: the entity tree, anchors, the syntax diff, flow views, and the workspace graph."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
ra_ap_syntax = "=0.0.360"
semilla-core = { path = "../semilla-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
